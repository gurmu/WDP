# iac/config/route-table.yaml
#
# HAND-AUTHORED, VERSION-CONTROLLED SOURCE OF TRUTH.
#
# CONOPS AWOZ-1227 v1.5 §2.3.2, instantiated as configuration. E1 Task
# 1.3. E2 Task 2.3 GENERATES iac/gravitee/api-definition.json from this
# file plus policy-classes.yaml -- it does not transcribe it. A route
# table that exists twice will diverge, and the divergence gets found by
# a reviewer rather than by a test.
#
# WHY THE NOT-EXPOSED ROWS ARE HERE. A route table that lists only what
# is allowed cannot express deny-by-default. One that names the
# deliberately-excluded routes can, and route X ("everything else") then
# has something to be the complement of. M3, A1 and X are therefore
# rows, with `exposed: false`, and each becomes an EXPLICIT DENY FLOW in
# the generated definition -- not an omission. An omission and a denial
# produce the same traffic outcome and opposite evidence: the omission
# emits Gravitee's own 404 shape and no record of a decision; the denial
# emits the protocol error format §2.3.2 requires and appears in the
# gateway log.
#
# UNCONFIRMED FIELDS ARE FLAGGED, NOT GUESSED. Where §2.3.2 abbreviates
# a path or defers it to a test, the row carries `*_unconfirmed: true`
# and names what settles it. A generator that emitted a guessed path
# would produce a flow that matches nothing, and the resulting test
# evidence would grade the guess rather than the route.

schema_version: 1

conops:
  document: CONOPS_AWOZ-1227_v1.5.docx
  version: v1.5
  section: "2.3.2"
  policy_classes_section: "2.3.3"

# §2.3.2: "The edge base address is the Gravitee domain. On sharing
# routes the edge path equals the protocol path, and the target is the
# endpoint from the credential file plus the same path, so reference
# clients need only the endpoint changed (§3.4.1). Routes not listed are
# denied."
edge:
  base_address_source: GRAVITEE_EDGE_BASE
  sharing_listener:
    path: /opensharing-demo
    rule: >-
      On sharing routes the edge path equals the protocol path. The
      listener prefix is the only difference between the two, and
      §3.4.1's promise -- reference clients need only the endpoint
      changed -- depends on nothing else being rewritten.
    retires: /delta-sharing
    retires_because: >-
      B-1 as reclassified: the /delta-sharing API's upstream target was
      wrong. E2 Task 2.1 consolidates onto one API using the endpoint
      from the issued credential file. Verify against the consolidated
      listener, never against /delta-sharing.
    per_recipient_suffix: true
    per_recipient_suffix_added: "2026-10-21"
    per_recipient_suffix_because: >-
      CORRECTION TO THE RULE ABOVE, CARRIED IN PLACE (B-19). The real
      edge path is /opensharing-demo/<recipient-slug> + the protocol
      path, not /opensharing-demo + the protocol path. "E2 Task 2.1
      consolidates onto ONE API" above is SUPERSEDED: it cannot. The
      sharing host is per-recipient and the platform validates the
      host/token binding -- 400 BAD_REQUEST "Request URL hostname ...
      does not match with the recipient id ...". So E-1 is a route
      FAMILY, one API per recipient, each pinned to its own upstream.
      docs/11 B-42, docs/10 D-9, generated by
      scripts/29_gen_gravitee_route_family.py.
    cost_of_the_suffix: >-
      §3.4.1's promise that reference clients "need only the endpoint
      changed" SURVIVES, because the slug is part of the endpoint the
      client is handed in its rewritten credential. The client never
      learns its slug from anywhere else and never composes it. What does
      not survive is §2.3.2's claim that the edge path equals the
      protocol path: it equals the listener prefix PLUS THE SLUG plus the
      protocol path. v1.6 has to say so.
    what_the_slug_is_not: >-
      The slug is a recipient NAME, not a credential. It appears in URLs,
      logs and the route table. Choosing the recipient by path rather
      than by token is what keeps the gateway free of a token-to-host
      directory, which is the OD-4 concern D-9's second option runs into.
  storage_proxy_listener:
    path: /storage-proxy
    carries_routes: [F1]
    rule: >-
      F1 gets its OWN HTTP listener, not a flow selector beneath the
      sharing listener. This resolves B-3 / document defect D-4: as
      §2.3.2 is written F1 sits under the sharing listener, making the
      real edge path /delta-sharing/storage-proxy, while .env declares
      http://localhost:8082/storage-proxy. One of the two had to change,
      and .env is the source of truth.
    env: GRAVITEE_STORAGE_PROXY_URL
    conops_defect: D-4

# Symbolic targets. Rows name a target by key; the key resolves here, so
# a hostname never appears in a route row and the credential file stays
# the single place the sharing endpoint is defined.
targets:
  sharing_endpoint:
    resolution: >-
      The `endpoint` field of the issued credential file (§3.4.1), plus
      the same protocol path.
    env: DATABRICKS_SHARING_ENDPOINT
    env_status: SUPERSEDED_SINGLE_VALUE
    env_status_because: >-
      CARRIED FORWARD, NOT ERASED (B-19). One environment variable holds
      one endpoint, and there is no single endpoint to hold. The variable
      stays because it still names the shape for a reader and other
      scripts read it, but a generator that resolves this target from
      .env pins every recipient to one recipient's host. Resolve from
      _secrets/credential-<recipient>.json instead.
    per_recipient: true
    per_recipient_because: >-
      Each recipient's issued credential carries its OWN endpoint
      hostname, and the platform validates the binding between host and
      bearer token: 400 BAD_REQUEST "Request URL hostname '<a>' does not
      match with the recipient id '<b>'". A single fixed upstream is
      correct for exactly one recipient and wrong for every other, and
      the refusal is the platform working as intended. docs/11 B-42,
      docs/10 D-9.
    observed_shape: "<uuid>.opensharing.<region>.cloud.databricks.com"
    observed_base_path: "/api/2.0/opensharing/metastores/<metastore-id>"
    observed_base_path_note: >-
      The METASTORE segment is identical across all three recipients on
      this workspace; only the HOST differs. That matters twice. It means
      the per-recipient part is the hostname alone, so a future
      path-based single-route design is not blocked by the base path. And
      it means gravitee/api-definition.json's target of
      /api/2.0/delta-sharing names a path that appears in NO issued
      credential -- the route was pointed at something that does not
      exist, which explains T-01's history better than
      "misconfiguration" does.
    note: >-
      Databricks serves open sharing from a dedicated opensharing host
      that is neither the workspace host nor the account host. A route
      pointed at the workspace host will not reach the sharing server.
  storage_host_from_signed_url:
    resolution: >-
      The host named inside the pre-signed URL in the response body.
      Not configurable: it is whatever the sharing server vended.
    note: >-
      `accessModes: ["url"]` on this tier confirms pre-signed URLs are
      vended, so F1 has real response-body URLs to rewrite -- in
      newline-delimited JSON on S8, not in a single JSON document.
  workspace_host:
    resolution: Databricks workspace host, same path.
    env: DATABRICKS_HOST
  not_forwarded:
    resolution: >-
      No upstream. The flow terminates at the edge with the protocol
      error format.

policy_classes:
  source: iac/config/policy-classes.yaml
  owner: E2 Task 2.4
  status: PENDING
  note: >-
    Classes A-E and the common policy set live there, not here. §2.3
    is explicit that the class values are "proposals to be tuned in the
    Section 5 tests; they are not commitments", so the tuned values are
    recorded as T-05 output rather than by editing the starting values.

selector_rule:
  statement: >-
    Flow selectors MUST match on method AND path.
  because: >-
    The protocol distinguishes GET .../tables/{table}/metadata (class A)
    from POST .../tables/{table}/query (class B) on overlapping paths. A
    path-only selector silently puts the query route in class A, and
    T-05's rate-limit evidence then measures the wrong class while
    looking correct.

routes:

  - id: S1
    channel: E-1
    methods: [GET]
    protocol_path: /shares
    edge_path_equals_protocol_path: true
    target: sharing_endpoint
    policy_class: A
    exposed: true
    purpose: List shares
    tests: [T-01]
    prototype_observed: "200 through the gateway (§11.7 B-1 probe)"

  - id: S2
    channel: E-1
    methods: [GET]
    protocol_path: /shares/{share}
    edge_path_equals_protocol_path: true
    target: sharing_endpoint
    policy_class: A
    exposed: true
    purpose: Share detail
    tests: [T-01]

  - id: S3
    channel: E-1
    methods: [GET]
    protocol_path: /shares/{share}/schemas
    edge_path_equals_protocol_path: true
    target: sharing_endpoint
    policy_class: A
    exposed: true
    purpose: List schemas in a share
    paginated: true
    pagination_params: [maxResults, pageToken]
    tests: [T-01]

  - id: S4
    channel: E-1
    methods: [GET]
    protocol_path: /shares/{share}/schemas/{schema}/tables
    edge_path_equals_protocol_path: true
    target: sharing_endpoint
    policy_class: A
    exposed: true
    purpose: List tables in a schema
    paginated: true
    pagination_params: [maxResults, pageToken]
    tests: [T-01]

  - id: S5
    channel: E-1
    methods: [GET]
    protocol_path: /shares/{share}/all-tables
    edge_path_equals_protocol_path: true
    target: sharing_endpoint
    policy_class: A
    exposed: true
    purpose: List all tables in a share
    paginated: true
    pagination_params: [maxResults, pageToken]
    tests: [T-01]
    prototype_observed: "200 through the gateway (§11.7 B-1 probe)"

  - id: S6
    channel: E-1
    methods: [GET]
    protocol_path: /shares/{share}/schemas/{schema}/tables/{table}/version
    edge_path_equals_protocol_path: true
    target: sharing_endpoint
    policy_class: A
    exposed: true
    purpose: Returns the table version
    tests: [T-01]
    note: >-
      §2.3.2 abbreviates this path as "GET .../tables/{table}/version".
      Expanded here against the sharing protocol reference so the
      generator has a complete selector.

  - id: S7
    channel: E-1
    methods: [GET]
    protocol_path: /shares/{share}/schemas/{schema}/tables/{table}/metadata
    edge_path_equals_protocol_path: true
    target: sharing_endpoint
    policy_class: A
    exposed: true
    purpose: Schema and format
    passthrough_headers: [delta-sharing-capabilities]
    passthrough_note: >-
      §2.3.2: "capability header passes through". It must survive the
      header-sanitization policy T-07 exercises, which strips internal
      headers -- the two policies meet on this route and the sanitizer
      must not take this one with it.
    tests: [T-01, T-07]

  - id: S8
    channel: E-1
    methods: [POST]
    protocol_path: /shares/{share}/schemas/{schema}/tables/{table}/query
    edge_path_equals_protocol_path: true
    target: sharing_endpoint
    policy_class: B
    exposed: true
    purpose: Query a table
    request_body:
      schema: iac/gravitee/schemas/query-body.schema.json
      owner: E2 Task 2.4
      status: PENDING
      allowed_fields:
        - predicateHints
        - jsonPredicateHints
        - limitHint
        - version
        - timestamp
        - startingVersion
        - endingVersion
      additional_properties: false
    response_format: newline_delimited_json
    response_contains_signed_urls: true
    f1_rewrite_applies: true
    f1_rewrite_note: >-
      The URLs F1 must rewrite are here, one per line, not in a single
      JSON document. A rewrite written against a single-document
      assumption will silently leave the later lines untouched.
    tests: [T-01, T-05, T-06, T-08]

  - id: S9
    channel: E-1
    methods: [GET]
    protocol_path: /shares/{share}/schemas/{schema}/tables/{table}/changes
    edge_path_equals_protocol_path: true
    target: sharing_endpoint
    policy_class: B
    exposed: true
    purpose: Change data feed
    conditional: >-
      Only if the provider shares history. Confirmed available on this
      tier: history_data_sharing_status ENABLED on the shared table
      (§11.3).
    tests: [T-19]

  - id: S10
    channel: E-1
    methods: [POST]
    protocol_path: /shares/{share}/schemas/{schema}/tables/{table}/temporary-table-credentials
    protocol_path_unconfirmed: true
    protocol_path_unconfirmed_because: >-
      §2.3.2 gives this route as "POST /temporary-table-credentials"
      with the note "Exact path confirmed against the API reference in
      the test". The value above is the candidate expansion, NOT a
      confirmed path. It must be settled against the sharing API
      reference before the flow is generated: a selector on the wrong
      path matches nothing, and the resulting 404 would be recorded as
      an edge refusal.
    settled_by: E2 Task 2.3
    edge_path_equals_protocol_path: true
    target: sharing_endpoint
    policy_class: C
    exposed: true
    purpose: Temporary table credentials (delta-sharing credential vending)
    tests: [T-01]

  - id: F1
    channel: E-1
    methods: [GET, HEAD]
    protocol_path: /files/{opaque}
    edge_path_equals_protocol_path: false
    edge_path: /storage-proxy/files/{opaque}
    edge_listener: storage_proxy_listener
    target: storage_host_from_signed_url
    policy_class: D
    exposed: true
    purpose: File download through the gateway storage proxy
    open_decision: OD-1(b)
    requirements:
      - "Range requests must pass (class D allows range)."
      - "The signed query string is forwarded UNCHANGED -- any rewrite of it invalidates the signature."
      - "URLs in S8 and S9 response bodies are rewritten to this route."
    fallback: >-
      §2.2 step 6 and §3.2: if testing shows the gateway cannot forward
      signed requests, the fallback is storage address limits plus
      short-lived credentials. The fallback is a documented outcome, not
      a failure.
    prototype_limit: >-
      T-08's refusal half is not provable here: Free Edition storage is
      Databricks-managed, so storage-side egress restrictions cannot be
      set. Record the OD-1 fallback rather than a refusal we cannot
      produce.
    tests: [T-08]
    conops_defect: D-4

  - id: M1
    channel: E-3
    methods: [POST]
    protocol_path: /serving-endpoints/{name}/invocations
    edge_path_equals_protocol_path: true
    target: workspace_host
    policy_class: E
    exposed: true
    exposure_scope: >-
      One approved model service per route. Not a wildcard over
      /serving-endpoints.
    governed_by: Unity AI Gateway
    upstream_identity: >-
      §3.2: an external caller holds no Databricks credential. The
      gateway holds one upstream identity per consumer -- a service
      principal granted only the assets that consumer may call -- and
      forwards with its OAuth token. Whether the gateway can inject it
      is R12.
    risk: R12
    tests: [T-15]
    prototype_observed: >-
      databricks-gpt-oss-20b answered HTTP 200 called directly, and
      /api/2.0/serving-endpoints lists 12 endpoints automatably. Two
      caveats carry into the route build: the probe used max_tokens=16
      and returned finish_reason 'length' with a reasoning-only block,
      so the full response shape is uncaptured; and `content` is an
      array of typed blocks, not a string, so the class E schema must
      validate the array form.

  - id: M2
    channel: E-3
    methods: [POST]
    methods_unconfirmed: false
    methods_confirmed_by: scripts/32_probe_m2_mcp_methods.py
    methods_confirmed_evidence: evidence/m2-mcp-methods.json
    methods_confirmed_on: "2026-10-22"
    methods_confirmed_because: >-
      MEASURED, replacing the inference below. On a well-formed service
      name GET returns 405 Method Not Allowed BOTH with and without
      `text/event-stream` in the Accept header, so the 405 is not
      content negotiation -- this tier offers no GET event stream. POST
      on the same name reaches the MCP dispatcher (JSON-RPC envelope,
      error -32007 "Not authorized to invoke MCP service"), which is the
      dispatcher authenticating and routing before refusing on
      authorization, and is therefore what confirms the verb. A
      POST-only selector drops nothing here because there is no stream
      to drop.
    methods_unconfirmed_because_RETRACTED: >-
      RETRACTED 2026-10-22, kept in place per B-19. The original note
      read: "§2.3.2 gives the method as 'MCP', which is a protocol
      rather than an HTTP method. Streamable-HTTP MCP uses POST for
      calls and may use GET for the event stream. T-16 settles which
      methods the selector needs; a POST-only selector would silently
      drop the stream." The hazard it named was real and correctly
      stated; it is now answered by measurement rather than by T-16,
      which did not reach this path. Note the scope of the answer: "no
      GET stream ON THIS TIER" is not "no GET stream". A production
      workspace with a registered MCP service may offer one, so the
      production selector should be re-probed the same way -- the point
      is that there is now a method for asking instead of a guess.
    protocol_path: /ai-gateway/mcp-services/{catalog}.{schema}.{leaf}
    protocol_path_corrected: >-
      §2.3.2 writes this segment as `{mcp-name}`, an opaque service
      slug. The server requires `mcp-services/{catalog}.{schema}.{leaf}`
      -- it says so in its own error message when given a malformed name
      (evidence/m2-mcp-methods.json, probe `malformed_name`). The
      segment therefore carries a Unity Catalog OBJECT IDENTITY, and the
      consequence is not cosmetic: M2's authorization scope is
      per-UC-object, so the allow-list question for this route is "which
      catalog.schema.leaf may be invoked", not "which service". Those
      are different allow-lists with different owners. v1.6 correction.
    edge_path_equals_protocol_path: true
    target: workspace_host
    policy_class: E
    exposed: true
    exposure_scope: Unity Gateway MCP only.
    auth_scope: ai-gateway OAuth scope
    tool_restriction: read-only tools only
    tests: [T-16]
    open_decision: OD-8
    prototype_status: >-
      UPDATED 2026-10-22. The MCP surface is LIVE and callable on this
      tier: /ai-gateway/mcp-services/<uc-name> authenticates, routes,
      and answers in JSON-RPC. What it refuses is INVOCATION -- error
      -32007 "Not authorized to invoke MCP service", because no MCP
      service is registered and entitled to this principal. So the
      route's method and path shape are settled and the end-to-end tool
      call is not. The earlier status ("whether that tab holds, or
      permits creating, a CALLABLE MCP server on this tier") is answered
      in the affirmative for the dispatcher and unanswered for a
      registered service.
    prototype_status_trap: >-
      The malformed-name probe returns HTTP 200 carrying a JSON-RPC
      ERROR. Any health check on this route that asserts on the HTTP
      status code will report a broken or unauthorized MCP service as
      healthy. A monitor for M2 must assert on the JSON-RPC body, not on
      the status line. This generalises beyond M2 and belongs in v1.6.

  - id: M3
    channel: E-3
    methods: [ANY]
    protocol_path: /api/2.0/mcp/*
    target: not_forwarded
    policy_class: null
    exposed: false
    enforcement: explicit_deny_flow
    purpose: Legacy managed MCP
    not_exposed_because: >-
      Databricks documents that these bypass Unity AI Gateway grants,
      policies and guardrails, and their calls do not appear in the
      tracing tables. A route that is invisible to the audit path cannot
      satisfy AC5 on any consumer.
    conops_ref: "§2.3.2 row M3; §3.1.2"
    carry_reason_into_generated_artifact: true
    carry_reason_note: >-
      The reason above belongs in the generated api-definition.json
      where an auditor will find it, not only in this file.
    tests: [T-16]
    tests_note: >-
      The negative half of T-16 -- legacy /api/2.0/mcp/* unreachable
      from the edge -- is buildable regardless of M2's outcome, and
      closes half of OD-8 on its own.

  - id: A1
    channel: E-3
    methods: [ANY]
    protocol_path: "Other Databricks REST APIs (for example SQL statements)"
    protocol_path_is_a_class_not_a_path: true
    target: not_forwarded
    policy_class: null
    exposed: false
    exposed_default: false
    enforcement: explicit_deny_flow
    not_exposed_because: >-
      Not exposed by default. Added only by change request, each with
      its own route, schema and limit -- which means each addition
      becomes a new row in this file, reviewed as a diff.
    conops_ref: "§2.3.2 row A1"
    change_request_required: true
    tests: []

  - id: X
    channel: null
    channel_note: >-
      Applies to every Gravitee-fronted channel (E-1, E-3, I-2). Not
      scoped to one.
    methods: [ANY]
    protocol_path: "*"
    target: not_forwarded
    policy_class: null
    exposed: false
    enforcement: explicit_catch_all_deny_flow
    purpose: Everything else, denied
    not_exposed_because: >-
      §2.3.2: "Routes not listed are denied." X is that sentence made
      into a flow. It is not a route that was considered and rejected
      like M3 and A1; it is the complement of the fifteen rows above,
      and it exists so that deny-by-default produces a response in the
      protocol error format and a line in the gateway log instead of
      silence.
    error_format:
      style: protocol_error
      fields: [errorCode, message]
      must_not_be: >-
        Gravitee's own 404 shape (the NotFoundProcessor body recorded in
        §11.7 B-3). A reference client parsing the protocol error format
        cannot read that body, so a correct denial would look like a
        broken gateway.
    build_regardless: true
    build_regardless_because: >-
      §3.2 offers "explicit catch-all deny route" as the fallback if
      deny-by-default is not native. Build it either way: it is the only
      way the denial emits the protocol error format §2.3.2 requires.
    conops_ref: "§2.3.2 row X; §3.2 capability table"
    tests: [T-02, T-03]

# Routes the CONOPS route table does not cover. Recorded here because an
# uncovered path is not a neutral absence -- it falls to X, and whether
# that is the intended outcome is a decision someone has to make.
gaps:

  - id: GAP-ICEBERG
    path: /iceberg
    discovered: 2026-10-18
    discovered_by: >-
      Task 1.1's credential merge. Repairing the OD-4 bypass made
      `icebergEndpoint` rewrite to <gateway-edge>/iceberg, which exposed
      a hole the bypass had been masking.
    current_behaviour: >-
      Matches no route and falls to X. Fail CLOSED, and the refusal
      appears in the gateway log.
    behaviour_before_the_fix: >-
      The client reached Databricks directly. Fail OPEN -- a silent
      perimeter bypass with nothing logged at the gateway.
    why_it_is_recorded_as_a_gap_not_a_route: >-
      Falling to X is the correct outcome, but it is currently an
      accident rather than a decision. Either /iceberg is a supported
      egress route and needs a row with a policy class, or it is
      deliberately not exposed and needs an explicit deny row like M3.
      Inventing an id here would put a route in this file that §2.3.2
      does not have, and E6's consistency check would then compare this
      file against a document that disagrees with it.
    decision_owner: E2
    decision_status: OPEN
    conops_action: >-
      v1.6 §2.3.2 needs the row, in whichever of the two forms is
      chosen.
    evidence: docs/12-test-matrix.md#12.8

  - id: GAP-I2-ROUTE
    channel: I-2
    discovered_by: E1 Task 1.3 (this file)
    what_is_missing: >-
      §2.3.2 gives the I-2 push route no id, so the push ingest path
      specified in §2.4.5 prose has no row, no policy class and no
      exposure decision in the route table.
    consequence: >-
      T-24's six refusal paths are gateway policy on a route that the
      route table does not describe. The policies can still be built,
      but they cannot be generated from this file, and the generated
      api-definition.json will not show an auditor that the push route
      was a considered exposure.
    decision_owner: E2
    decision_status: OPEN
    conops_action: >-
      v1.6 §2.3.2 should carry the push route with an id, a class and
      an exposure decision, like every other fronted path.

# What a generator and E6's consistency check must be able to assert.
invariants:
  - >-
    Every id in §2.3.2 appears exactly once: S1-S10, F1, M1, M2, M3, A1,
    X. Sixteen rows.
  - >-
    Every row has `exposed`, and every row with `exposed: false` has
    `enforcement` and a `not_exposed_because`.
  - >-
    Every row with `exposed: true` has a non-null `policy_class`, and
    every row with `exposed: false` has a null one.
  - >-
    S7 and S8 resolve to DIFFERENT classes (A and B) despite overlapping
    paths. If a generator puts them in the same class, the selector is
    path-only and T-05 is measuring the wrong thing.
  - >-
    Every `target` key used by a row exists in `targets`.
  - >-
    Every `channel` value used by a row exists in channels.yaml, and
    every channel whose `gravitee_fronts` is true has at least one row
    here or a recorded gap.
  - >-
    No row carries a hostname. Hosts resolve through `targets` only.
  - >-
    No row carries a secret, a token or a credential path. §3.6: secrets
    appear only as .env references.
